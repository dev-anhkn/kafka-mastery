version: '3.8'services:  kafka:    image: apache/kafka:latest    # Image chính thức của Apache Kafka (KRaft mode)    container_name: kafka         # Đặt tên container để dễ gọi lệnh    ports:      - "9092:9092"               # Map port 9092 máy host → container (client kết nối vào đây)    environment:      KAFKA_NODE_ID: 1            # ID duy nhất của node này trong cluster      KAFKA_PROCESS_ROLES: broker,controller      # Gộp 2 vai trò trong 1 node:      # - broker: nhận/gửi message      # - controller: thay thế Zookeeper, quản lý metadata cluster      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093      # Kafka lắng nghe trên 2 cổng:      # - 9092: cho client (producer/consumer) kết nối      # - 9093: cho controller nội bộ cluster giao tiếp      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092      # Địa chỉ Kafka "quảng bá" ra ngoài cho client biết để kết nối      # Dùng localhost vì đang chạy local      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER      # Chỉ định listener nào dùng cho controller (KRaft)      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT      # Map tên listener → protocol bảo mật      # Cả 2 đều dùng PLAINTEXT (không mã hoá) vì đang dev local      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093      # Danh sách các node tham gia bầu chọn leader (quorum)      # Format: nodeId@hostname:port      # Hiện chỉ có 1 node duy nhất      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1      # Topic nội bộ __consumer_offsets chỉ replicate 1 bản      # Để 1 vì chỉ có 1 broker, nếu cluster nhiều node thì tăng lên      KAFKA_LOG_DIRS: /var/lib/kafka/data      # Thư mục lưu data (messages) bên trong container